services:
  pathway_postgresdb:
    image: postgres:19rc2-trixie #Recommended to pull externally
    container_name: pathway_postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"

    ports:
      - "4100:5432" #This port is for local development, when deploy we remove it and use the internal docker network to connect to the database.

    volumes:
      - ./data:/var/lib/postgresql/data
      # I will throw SQL script to initialize the database later.
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql

    secrets:
      - db_user
      - db_password
      - db_name

    volumes:
      - pg_data:/var/lib/postgresql
      - ./certs/server.crt:/var/lib/postgresql/server.crt:ro
      - ./certs/server.key:/var/lib/postgresql/server.key:ro

    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key

    ports:
      - "4100:5432" #This port is for local development, when deploy we remove it and use the internal docker network to connect to the database.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend_net 

networks:
    backend_net:
        external: true


secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt

volumes:
  pg_data:./data